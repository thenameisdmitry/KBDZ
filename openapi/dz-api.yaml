openapi: 3.0.3

info:
  title: DZ Enterprise API
  version: 1.0.0
  description: |
    REST API for the DZ Enterprise treasury platform.

    This specification is a portfolio artifact: it describes a fictional API and no
    live server implements it. It exists to show how I model an API contract in
    OpenAPI and generate reference documentation from it.

    The hand-written reference at `/api` and this specification describe the same
    surface. Read the hand-written pages for narrative and worked examples, and this
    file for the machine-readable contract.

    ## Conventions

    - All requests and responses use `application/json`.
    - Collections are paged with `limit` and `offset` and return a `data`/`total` envelope.
    - Timestamps are RFC 3339 in UTC. Dates are ISO 8601 without a time component.
    - Monetary amounts are decimals in the major unit, always paired with a currency code.
    - Every `POST` accepts an `Idempotency-Key` header so a retry cannot create a duplicate.
  contact:
    name: Dmitrii Zhukov
    url: https://thenameisdmitry.github.io/KBDZ/
    email: storiesbydz@gmail.com
  license:
    name: Portfolio sample. Not for production use.
    url: https://thenameisdmitry.github.io/KBDZ/api

servers:
  - url: https://api.dzenterprise.io/v1
    description: Production
  - url: https://api.uat.dzenterprise.io/v1
    description: UAT (sandbox)

tags:
  - name: Accounts
    description: Custodian Accounts. Reference data for every downstream operation.
  - name: Portfolios
    description: Portfolios and their Account allocations.
  - name: Custodians
    description: Banks, prime brokers, and clearing houses that hold your assets.
  - name: Transactions
    description: Wires, money market operations, security movements, and margin calls.
  - name: Payments
    description: Cash instructions settled through a Custodian over SWIFT, SEPA, Faster Payments, or internally.
  - name: Credit Agreements
    description: Credit Agreements scoped to an Account.

security:
  - OAuth2ClientCredentials: []

paths:
  # ── Accounts ───────────────────────────────────────────────────────────────
  /accounts:
    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List accounts
      description: Returns a paginated list of Accounts. Filter by status to narrow results.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          required: false
          description: Filter by Account status.
          schema:
            $ref: '#/components/schemas/AccountStatus'
      responses:
        '200':
          description: A page of Accounts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create account
      description: Creates an Account for the specified owner and returns the created resource.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: The Account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique Account identifier, for example `acc_007`.
        schema:
          type: string
        example: acc_007
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get account by ID
      description: Retrieves the full details of a single Account.
      responses:
        '200':
          description: The Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAccount
      tags: [Accounts]
      summary: Update account
      description: |
        Partially updates an Account. Only the fields you send are modified.
        `currency` and `type` are fixed at creation and cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: The updated Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: removeAccount
      tags: [Accounts]
      summary: Remove account
      description: |
        Permanently deletes an Account and all its associated data. This action cannot
        be undone. An Account that still holds an open Position returns `409 conflict`.
      responses:
        '204':
          description: The Account was deleted. No body is returned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Portfolios ─────────────────────────────────────────────────────────────
  /portfolios:
    get:
      operationId: listPortfolios
      tags: [Portfolios]
      summary: List portfolios
      description: Returns a paginated list of Portfolios. Filter by strategy or status to narrow results.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: strategy
          in: query
          required: false
          description: Filter by investment strategy label.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PortfolioStatus'
      responses:
        '200':
          description: A page of Portfolios.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Portfolio'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createPortfolio
      tags: [Portfolios]
      summary: Create portfolio
      description: Creates a Portfolio and attaches the supplied Account allocations.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioCreate'
      responses:
        '201':
          description: The Portfolio was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /portfolios/{portfolio_id}:
    parameters:
      - name: portfolio_id
        in: path
        required: true
        description: Unique Portfolio identifier, for example `prt_BNPParibas_001`.
        schema:
          type: string
        example: prt_BNPParibas_001
    get:
      operationId: getPortfolio
      tags: [Portfolios]
      summary: Get portfolio by ID
      description: Retrieves a single Portfolio, including its current total value and Account allocations.
      responses:
        '200':
          description: The Portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePortfolio
      tags: [Portfolios]
      summary: Update portfolio
      description: Partially updates a Portfolio. Only the fields you send are modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioUpdate'
      responses:
        '200':
          description: The updated Portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: removePortfolio
      tags: [Portfolios]
      summary: Remove portfolio
      description: Permanently deletes a Portfolio and all its holdings records.
      responses:
        '204':
          description: The Portfolio was deleted. No body is returned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Custodians ─────────────────────────────────────────────────────────────
  /custodians:
    get:
      operationId: listCustodians
      tags: [Custodians]
      summary: List custodians
      description: Returns a paginated list of Custodians. Filter by institution type, country, or status.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: institution_type
          in: query
          schema:
            $ref: '#/components/schemas/InstitutionType'
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 country code.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CustodianStatus'
      responses:
        '200':
          description: A page of Custodians.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Custodian'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createCustodian
      tags: [Custodians]
      summary: Create custodian
      description: |
        Registers a Custodian in your environment. A new Custodian starts with
        `status: active`. Reusing an existing `code` returns `409 conflict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodianCreate'
      responses:
        '201':
          description: The Custodian was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Custodian'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /custodians/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique Custodian identifier, for example `cus_BNP_001`.
        schema: { type: string }
        example: cus_BNP_001
    get:
      operationId: getCustodian
      tags: [Custodians]
      summary: Get custodian by ID
      description: Retrieves the full details of a single Custodian.
      responses:
        '200':
          description: The Custodian.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Custodian'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCustodian
      tags: [Custodians]
      summary: Update custodian
      description: |
        Partially updates a Custodian. Only the fields you send are modified.
        `code`, `institution_type`, and `country` are fixed at creation, because
        downstream feed files and settlement instructions are keyed on them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodianUpdate'
      responses:
        '200':
          description: The updated Custodian.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Custodian'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: removeCustodian
      tags: [Custodians]
      summary: Remove custodian
      description: |
        Permanently deletes a Custodian. A Custodian that still has Accounts or
        unsettled Payments returns `409 conflict`. To retire an institution while
        keeping its history, set `status` to `inactive` instead.
      responses:
        '204':
          description: The Custodian was deleted. No body is returned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Transactions ───────────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List transactions
      description: Returns a paginated list of Transactions. Filter by account, portfolio, type, or status.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: account_id
          in: query
          schema: { type: string }
        - name: portfolio_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
      responses:
        '200':
          description: A page of Transactions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: Create transaction
      description: |
        Records a Transaction. The Transaction starts in `pending` status and is
        processed asynchronously. Always send an `Idempotency-Key`: without it, a
        network timeout can result in a duplicate money movement.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201':
          description: The Transaction was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique Transaction identifier.
        schema: { type: string }
        example: TN_WIRE_10062026_78
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Get transaction by ID
      description: Fetches the full record for a single Transaction, including metadata and status.
      responses:
        '200':
          description: The Transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTransaction
      tags: [Transactions]
      summary: Update transaction
      description: |
        Updates the mutable fields of a Transaction. Only a Transaction in `pending`
        status can have its status changed; any other status returns `409 conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        '200':
          description: The updated Transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: removeTransaction
      tags: [Transactions]
      summary: Remove transaction
      description: |
        Deletes a Transaction record. Only Transactions with `pending` or `failed`
        status can be deleted; a settled Transaction is part of the audit trail.
      responses:
        '204':
          description: The Transaction was deleted. No body is returned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Payments ───────────────────────────────────────────────────────────────
  /payments:
    get:
      operationId: listPayments
      tags: [Payments]
      summary: List payments
      description: Returns a paginated list of Payments. Filter by account, custodian, method, or status.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: account_id
          in: query
          schema: { type: string }
        - name: custodian_id
          in: query
          schema: { type: string }
        - name: method
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: currency
          in: query
          description: ISO 4217 currency code.
          schema: { type: string }
      responses:
        '200':
          description: A page of Payments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Payment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      operationId: createPayment
      tags: [Payments]
      summary: Create payment
      description: |
        Initiates a Payment. It starts in `pending` status and settles
        asynchronously. Always send an `Idempotency-Key`: without it, a network
        timeout leaves you unable to tell whether the Payment was created, and a
        blind retry can pay the beneficiary twice.

        `payer_name` and `payer_account` are derived from the debited Account and
        must not be sent. `fee_amount` is quoted by the Custodian once the Payment
        is accepted, so it is null until the Payment reaches `processing`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: The Payment was initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique Payment identifier, for example `pay_10062026_441`.
        schema: { type: string }
        example: pay_10062026_441
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Get payment by ID
      description: Fetches the full record for a single Payment, including fees and settlement status.
      responses:
        '200':
          description: The Payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePayment
      tags: [Payments]
      summary: Update payment
      description: |
        Updates the mutable fields of a Payment. Only a Payment in `pending`
        status can be changed; any other status returns `409 conflict`.

        Amount, currency, beneficiary, and method are fixed once the Payment is
        initiated: changing them would make it a different instruction. Submit a
        new Payment instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdate'
      responses:
        '200':
          description: The updated Payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: removePayment
      tags: [Payments]
      summary: Remove payment
      description: |
        Deletes a Payment record. Only Payments with `pending` or `failed` status
        can be deleted: a settled or returned Payment is part of the audit trail.
        Reverse one with a compensating Payment instead.
      responses:
        '204':
          description: The Payment was deleted. No body is returned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Credit Agreements ──────────────────────────────────────────────────────
  /agreements:
    get:
      operationId: listAgreements
      tags: [Credit Agreements]
      summary: List credit agreements
      description: Returns a paginated list of Credit Agreements. Filter by account, status, or type.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - name: account_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AgreementStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AgreementType'
      responses:
        '200':
          description: A page of Credit Agreements.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CreditAgreement'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createAgreement
      tags: [Credit Agreements]
      summary: Create credit agreement
      description: Creates a Credit Agreement for the specified Account and returns the created resource.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditAgreementCreate'
      responses:
        '201':
          description: The Credit Agreement was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAgreement'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /agreements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique Credit Agreement identifier.
        schema: { type: string }
        example: agr_BNP_001
    get:
      operationId: getAgreement
      tags: [Credit Agreements]
      summary: Get credit agreement by ID
      description: Retrieves the full details of a single Credit Agreement.
      responses:
        '200':
          description: The Credit Agreement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAgreement'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAgreement
      tags: [Credit Agreements]
      summary: Update credit agreement
      description: |
        Partially updates a Credit Agreement. Only the fields you send are modified.
        `account_id`, `currency`, and `type` are fixed at creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditAgreementUpdate'
      responses:
        '200':
          description: The updated Credit Agreement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAgreement'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: removeAgreement
      tags: [Credit Agreements]
      summary: Remove credit agreement
      description: |
        Permanently deletes a Credit Agreement. Only agreements with `pending` or
        `terminated` status can be deleted.
      responses:
        '204':
          description: The Credit Agreement was deleted. No body is returned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: |
        OAuth 2.0 client credentials flow. Tokens expire after 3600 seconds; cache
        the token and refresh it before it expires.
      flows:
        clientCredentials:
          tokenUrl: https://auth.dzenterprise.io/oauth/token
          scopes:
            api:read: Read any resource the client is entitled to see.
            api:write: Create, update, and delete resources.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Results per page. Values above the maximum are clamped, not rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Results to skip before the page starts.
      schema:
        type: integer
        minimum: 0
        default: 0
    Sort:
      name: sort
      in: query
      required: false
      description: Field to sort by. Prefix with a hyphen for descending order.
      schema:
        type: string
        default: '-created_at'
      example: '-created_at'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Unique key for this logical operation, typically a UUID. Generate it once and
        reuse it on retries: the first request is processed and any later request with
        the same key returns the original response. Keys are retained for 24 hours.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request could not be parsed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: invalid_request
            message: The request body is not valid JSON.
            status: 400
            request_id: req_9f3c21a7
    Unauthorized:
      description: The Bearer token is missing, malformed, or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: unauthorized
            message: Bearer token is missing or has expired.
            status: 401
            request_id: req_9f3c21a7
    Forbidden:
      description: The token is valid but lacks the required scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: insufficient_scope
            message: This endpoint requires the api:write scope.
            status: 403
            request_id: req_9f3c21a7
    NotFound:
      description: No resource exists with the supplied identifier.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: not_found
            message: No account exists with id acc_999.
            status: 404
            request_id: req_9f3c21a7
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: conflict
            message: The account still holds an open position and cannot be deleted.
            status: 409
            request_id: req_9f3c21a7
    ValidationFailed:
      description: The request was well formed but one or more field values are invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: validation_failed
            message: The request contains one or more invalid fields.
            status: 422
            request_id: req_9f3c21a7
            details:
              - field: currency
                issue: Must be a valid ISO 4217 code.
    RateLimited:
      description: Too many requests in the current window.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: rate_limit_exceeded
            message: Rate limit of 600 requests per minute exceeded.
            status: 429
            request_id: req_9f3c21a7

  schemas:
    Error:
      type: object
      required: [error, message, status, request_id]
      properties:
        error:
          type: string
          description: Stable, machine-readable error code. Switch on this, never on the message.
          example: validation_failed
        message:
          type: string
          description: Human-readable explanation. Wording may change between releases.
        status:
          type: integer
          description: HTTP status code, repeated in the body for clients that log bodies only.
          example: 422
        request_id:
          type: string
          description: Identifier for this call. Quote it in any support request.
          example: req_9f3c21a7
        details:
          type: array
          description: Present on 422 only. One entry per rejected field.
          items:
            type: object
            properties:
              field: { type: string, example: currency }
              issue: { type: string, example: Must be a valid ISO 4217 code. }

    ListEnvelope:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          description: The page of results. Empty when nothing matches; never null.
          items: {}
        total:
          type: integer
          description: Total records matching the filter, across all pages.
          example: 137
        limit:
          type: integer
          description: The limit applied to this response, after clamping.
          example: 20
        offset:
          type: integer
          example: 0

    AccountType:
      type: string
      description: |
        Purpose the Account serves. Fixed at creation.
      enum: [trading, operating, custody, fee]
      example: fee

    AccountStatus:
      type: string
      enum: [active, suspended, closed]
      example: active

    Account:
      type: object
      required: [id, owner_id, name, type, currency, balance, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique Account identifier. Opaque; do not parse it.
          example: acc_007
        owner_id:
          type: string
          description: Identifier of the user who owns this Account.
          example: james_b
        name:
          type: string
          description: Human-readable label shown in the UI.
          example: BHMS Account 007
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          description: ISO 4217 code. Fixed at creation.
          example: GBP
        balance:
          type: number
          format: double
          description: Current balance in the major unit of `currency`.
          example: 12500000.00
        status:
          $ref: '#/components/schemas/AccountStatus'
        created_at:
          type: string
          format: date-time
          example: '2026-03-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-03-20T14:22:00Z'

    AccountCreate:
      type: object
      required: [owner_id, name, type, currency]
      properties:
        owner_id: { type: string, example: james_b }
        name: { type: string, example: Main Trading Account }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { type: string, example: USD }

    AccountUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, example: Primary Custodian Account }
        status: { $ref: '#/components/schemas/AccountStatus' }

    PortfolioStatus:
      type: string
      enum: [active, paused, closed]
      example: active

    PortfolioAllocation:
      type: object
      required: [id, name, owner_id, type, allocation_pct]
      properties:
        id: { type: string, example: acc_007 }
        name: { type: string, example: BHMS Account 007 }
        owner_id: { type: string, example: james_b }
        type: { $ref: '#/components/schemas/AccountType' }
        allocation_pct:
          type: number
          format: double
          description: Share of the Portfolio held in this Account. Allocations sum to 100.
          example: 58.93

    Portfolio:
      type: object
      required: [portfolio_id, name, strategy, currency, total_value, status, accounts, created_at, updated_at]
      properties:
        portfolio_id: { type: string, example: prt_BNPParibas_001 }
        name: { type: string, example: BHMS Portfolio BNP Paribas }
        strategy:
          type: string
          description: Investment strategy label applied to this Portfolio.
          example: loan benchmarking
        currency: { type: string, example: GBP }
        total_value:
          type: number
          format: double
          description: Sum of all Account balances, in the major unit of `currency`.
          example: 20000000.00
        status: { $ref: '#/components/schemas/PortfolioStatus' }
        accounts:
          type: array
          description: Accounts allocated to this Portfolio.
          items: { $ref: '#/components/schemas/PortfolioAllocation' }
        created_at: { type: string, format: date-time, example: '2026-02-01T08:00:00Z' }
        updated_at: { type: string, format: date-time, example: '2026-03-25T11:15:00Z' }

    PortfolioCreate:
      type: object
      required: [name, strategy, currency, accounts]
      properties:
        name: { type: string, example: BHMS Portfolio BNP Paribas }
        strategy: { type: string, example: loan benchmarking }
        currency: { type: string, example: GBP }
        accounts:
          type: array
          items:
            type: object
            required: [id, allocation_pct]
            properties:
              id: { type: string, example: acc_007 }
              allocation_pct: { type: number, format: double, example: 58.93 }

    PortfolioUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        strategy: { type: string }
        status: { $ref: '#/components/schemas/PortfolioStatus' }

    TransactionType:
      type: string
      description: |
        Nature of the money or asset movement.
      enum: [wire, money_market, security, fx_trade, cashflow, loan_tranche]
      example: wire

    TransactionStatus:
      type: string
      enum: [pending, processing, completed, failed, cancelled]
      example: completed

    Transaction:
      type: object
      required: [id, account_id, portfolio_id, type, amount, currency, status, reference, created_at, updated_at]
      properties:
        id: { type: string, example: TN_WIRE_10062026_78 }
        account_id: { type: string, example: acc_007 }
        portfolio_id: { type: string, example: prt_BNPParibas_001 }
        type: { $ref: '#/components/schemas/TransactionType' }
        amount:
          type: number
          format: double
          description: Movement amount in the major unit of `currency`. Always positive; direction follows `type`.
          example: 5000.00
        currency: { type: string, example: USD }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        reference:
          type: string
          description: Client-supplied or system-generated reference carried through to the counterparty.
          example: TN_MM_10062026_89
        notes:
          type: string
          nullable: true
          description: Free-text note. Null when none was supplied.
          example: Initial position entry
        created_at: { type: string, format: date-time, example: '2026-03-15T09:45:00Z' }
        updated_at: { type: string, format: date-time, example: '2026-03-15T09:45:12Z' }

    TransactionCreate:
      type: object
      required: [account_id, portfolio_id, type, amount, currency]
      properties:
        account_id: { type: string, example: acc_007 }
        portfolio_id: { type: string, example: prt_BNPParibas_001 }
        type: { $ref: '#/components/schemas/TransactionType' }
        amount: { type: number, format: double, example: 5000.00 }
        currency: { type: string, example: USD }
        reference: { type: string, example: TN_MM_10062026_89 }
        notes: { type: string, example: Initial position entry }

    TransactionUpdate:
      type: object
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/TransactionStatus' }
        reference: { type: string }
        notes: { type: string, nullable: true }

    InstitutionType:
      type: string
      description: Kind of institution holding the assets.
      enum: [custodian_bank, prime_broker, clearing_house, commercial_bank, fund_administrator]
      example: custodian_bank

    CustodianStatus:
      type: string
      description: |
        Only `active` Custodians accept new Accounts and Payments. `suspended`
        blocks new ones but leaves existing records untouched; `inactive` retires
        the institution while keeping its history.
      enum: [active, suspended, inactive]
      example: active

    Custodian:
      type: object
      required: [id, name, code, institution_type, country, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique Custodian identifier. Opaque, do not parse it.
          example: cus_BNP_001
        name:
          type: string
          description: Full legal name of the institution.
          example: BNP Paribas Securities Services
        code:
          type: string
          description: Short internal code, upper case, unique across the environment. Used on statements and feed files.
          example: BNPPSS
        institution_type:
          $ref: '#/components/schemas/InstitutionType'
        bic:
          type: string
          nullable: true
          description: SWIFT BIC, 8 or 11 characters. Null when the institution has none.
          example: PARBFRPP
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the registered entity.
          example: FR
        contact_email:
          type: string
          format: email
          nullable: true
          description: Operations mailbox used for reconciliation queries.
          example: custody.ops@example-bnp.com
        status:
          $ref: '#/components/schemas/CustodianStatus'
        created_at: { type: string, format: date-time, example: '2026-01-08T09:15:00Z' }
        updated_at: { type: string, format: date-time, example: '2026-03-18T13:40:00Z' }

    CustodianCreate:
      type: object
      required: [name, code, institution_type, country]
      properties:
        name: { type: string, example: BNP Paribas Securities Services }
        code:
          type: string
          description: Must be unique across the environment.
          example: BNPPSS
        institution_type: { $ref: '#/components/schemas/InstitutionType' }
        bic:
          type: string
          description: Required before the Custodian can settle SWIFT Payments.
          example: PARBFRPP
        country: { type: string, example: FR }
        contact_email: { type: string, format: email, example: custody.ops@example-bnp.com }

    CustodianUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        bic: { type: string, nullable: true }
        contact_email: { type: string, format: email, nullable: true }
        status: { $ref: '#/components/schemas/CustodianStatus' }

    PaymentMethod:
      type: string
      description: Settlement rail the instruction travels over.
      enum: [swift, sepa, faster_payments, internal]
      example: swift

    PaymentStatus:
      type: string
      description: |
        Position in the settlement lifecycle. `cancelled` is only reachable by
        withdrawing a `pending` Payment before it is sent to the Custodian.
      enum: [pending, processing, settled, failed, returned, cancelled]
      example: settled

    FeeBearer:
      type: string
      description: Which side carries the Custodian settlement fee.
      enum: [payer, beneficiary, shared]
      example: shared

    Payment:
      type: object
      required:
        [id, account_id, custodian_id, method, payer_name, payer_account,
         beneficiary_name, beneficiary_account, amount, currency, fee_bearer,
         value_date, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique Payment identifier. Opaque, do not parse it.
          example: pay_10062026_441
        account_id:
          type: string
          description: Account the Payment is debited from.
          example: acc_007
        custodian_id:
          type: string
          description: Custodian that settles the Payment.
          example: cus_BNP_001
        method:
          $ref: '#/components/schemas/PaymentMethod'
        payer_name:
          type: string
          description: Legal name of the paying party. Derived from the debited Account.
          example: BHMS Master Fund Ltd
        payer_account:
          type: string
          description: IBAN or local account number the funds leave from.
          example: GB29NWBK60161331926819
        beneficiary_name:
          type: string
          example: Northgate Capital Partners
        beneficiary_account:
          type: string
          description: IBAN or local account number the funds arrive at.
          example: FR7630006000011234567890189
        amount:
          type: number
          format: double
          description: Payment amount in the major unit of `currency`, excluding fees.
          example: 2400000.00
        currency:
          type: string
          description: ISO 4217 code, applying to both `amount` and `fee_amount`.
          example: EUR
        fee_amount:
          type: number
          format: double
          nullable: true
          description: |
            Settlement fee charged by the Custodian. Null until the Payment reaches
            `processing`, because the Custodian quotes it on acceptance. Zero when
            the rail is free.
          example: 45.00
        fee_bearer:
          $ref: '#/components/schemas/FeeBearer'
        value_date:
          type: string
          format: date
          description: Date the funds are due to clear.
          example: '2026-06-12'
        reference:
          type: string
          nullable: true
          description: Remittance information shown on the beneficiary statement.
          example: INV-2026-0441 capital call
        status:
          $ref: '#/components/schemas/PaymentStatus'
        created_at: { type: string, format: date-time, example: '2026-06-10T08:20:00Z' }
        updated_at: { type: string, format: date-time, example: '2026-06-12T06:05:00Z' }

    PaymentCreate:
      type: object
      required: [account_id, custodian_id, method, beneficiary_name, beneficiary_account, amount, currency]
      properties:
        account_id:
          type: string
          description: Account to debit. Must be active and hold sufficient balance.
          example: acc_007
        custodian_id:
          type: string
          description: Custodian that settles the Payment. Must be active.
          example: cus_BNP_001
        method: { $ref: '#/components/schemas/PaymentMethod' }
        beneficiary_name: { type: string, example: Northgate Capital Partners }
        beneficiary_account: { type: string, example: FR7630006000011234567890189 }
        amount:
          type: number
          format: double
          description: Positive decimal in the major unit of `currency`, excluding fees.
          example: 2400000.00
        currency:
          type: string
          description: Must be supported by the chosen `method`.
          example: EUR
        fee_bearer:
          allOf:
            - $ref: '#/components/schemas/FeeBearer'
          default: shared
        value_date:
          type: string
          format: date
          description: Defaults to the next business day.
          example: '2026-06-12'
        reference: { type: string, example: INV-2026-0441 capital call }

    PaymentUpdate:
      type: object
      minProperties: 1
      description: Only a Payment in `pending` status can be updated.
      properties:
        value_date:
          type: string
          format: date
          description: Must be today or later.
        reference: { type: string, nullable: true }
        fee_bearer: { $ref: '#/components/schemas/FeeBearer' }
        status:
          type: string
          description: Set to `cancelled` to withdraw the instruction before it is sent to the Custodian.
          enum: [cancelled]

    AgreementType:
      type: string
      description: Only Credit Agreements are exposed in v1.
      enum: [credit]
      example: credit

    AgreementStatus:
      type: string
      enum: [pending, active, terminated]
      example: active

    CreditAgreement:
      type: object
      required: [id, account_id, type, name, principal_amount, currency, interest_rate, start_date, maturity_date, status, created_at, updated_at]
      properties:
        id: { type: string, example: agr_BNP_001 }
        account_id:
          type: string
          description: Account this Agreement is scoped to. Fixed at creation.
          example: acc_007
        type: { $ref: '#/components/schemas/AgreementType' }
        name: { type: string, example: 'Credit Agreement — BHMS / BNP Paribas' }
        principal_amount:
          type: number
          format: double
          description: Facility principal in the major unit of `currency`.
          example: 50000000.00
        currency: { type: string, example: GBP }
        interest_rate:
          type: number
          format: double
          description: Annual interest rate as a percentage.
          example: 4.25
        start_date: { type: string, format: date, example: '2026-01-15' }
        maturity_date:
          type: string
          format: date
          description: Must be later than `start_date`.
          example: '2031-01-15'
        status: { $ref: '#/components/schemas/AgreementStatus' }
        created_at: { type: string, format: date-time, example: '2026-01-10T09:00:00Z' }
        updated_at: { type: string, format: date-time, example: '2026-03-20T14:22:00Z' }

    CreditAgreementCreate:
      type: object
      required: [account_id, type, name, principal_amount, currency, interest_rate, start_date, maturity_date]
      properties:
        account_id: { type: string, example: acc_007 }
        type: { $ref: '#/components/schemas/AgreementType' }
        name: { type: string, example: 'Credit Agreement — BHMS / BNP Paribas' }
        principal_amount: { type: number, format: double, example: 50000000.00 }
        currency: { type: string, example: GBP }
        interest_rate: { type: number, format: double, example: 4.25 }
        start_date: { type: string, format: date, example: '2026-01-15' }
        maturity_date: { type: string, format: date, example: '2031-01-15' }

    CreditAgreementUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        interest_rate: { type: number, format: double }
        maturity_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/AgreementStatus' }
